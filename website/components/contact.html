<section class="section contact" id="contact">
    <div class="container">
        <h6 class="section-title">{{content.section_contact}}</h6>
        <h3 class="section-heading">{{content.contact_heading}}</h3>
        <div class="contact-grid">
            <form class="contact-form" id="contact-form">
                <div class="form-group">
                    <label for="name">{{contact_label_name}}</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">{{contact_label_email}}</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">{{contact_label_phone}}</label>
                    <input type="tel" id="phone" name="phone">
                </div>
                <div class="form-group">
                    <label for="message">{{contact_label_message}}</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <div class="form-group form-checkbox">
                    <input type="checkbox" id="privacy" name="privacy" required>
                    <label for="privacy">{{contact_privacy_label}} <a href="{{baseUrl}}privacy.html" target="_blank">{{contact_privacy_link}}</a></label>
                </div>
                <button type="submit" class="btn btn-primary">{{contact_submit}}</button>
            </form>
            <div class="contact-info">
                <h3>{{site.name}}</h3>
                <address>
                    <p>{{site.address.street}}<br>{{site.address.postcode}} {{site.address.city}}</p>
                    <p><a href="tel:{{site.phone_international}}">{{site.phone}}</a></p>
                    <p><a href="mailto:{{site.email}}">{{site.email}}</a></p>
                </address>
                <p class="kvk">KvK: {{site.kvk}}</p>
                <div class="social-links">
                    <a href="{{site.social.linkedin}}" target="_blank" rel="noopener" aria-label="LinkedIn profile">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
