<section class="section about" id="about">
    <div class="container">
        <div class="about-grid">
            <div class="about-image">
                <img src="{{assetPrefix}}images/djoke-portrait.jpg" alt="{{site.owner}} - Real Estate Agent Amsterdam">
                <h2 class="about-name">{{site.owner}}</h2>
                <img src="{{assetPrefix}}images/certification-banner.png" alt="NVM Certified Real Estate Agent" class="certification-badge">
            </div>
            <div class="about-text">
                <p class="lead">{{content.about_lead}}</p>
                {{content.about_body_html}}
                <a href="#services" class="btn btn-primary">{{content.about_cta}}</a>
            </div>
        </div>
    </div>
</section>
